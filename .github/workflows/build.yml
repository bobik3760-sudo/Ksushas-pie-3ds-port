# Put this file at .github/workflows/build.yml in your GitHub repository.
# On every push it builds the game, publishes KsushaPie3DS.cia + .3dsx as a GitHub Release
# and creates KsushaPie3DS_QR.png - scan it with FBI (Remote Install > Scan QR Code) to install.
# The repository must be PUBLIC so the console can download the release file.

name: Build 3DS game + QR code

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack assets into romfs
        run: |
          set -e
          rm -rf romfs
          mkdir -p romfs
          unzip -oq assets.zip -d romfs
          echo "--- romfs top level ---"
          ls -la romfs | head -n 30
          # If the zip contained a single wrapper folder, move its contents up one level
          if [ "$(ls -A romfs | wc -l)" -eq 1 ] && [ -d "romfs/$(ls -A romfs)" ]; then
            inner="romfs/$(ls -A romfs)"
            echo "Flattening $inner"
            mv "$inner"/* romfs/
            rmdir "$inner" || true
          fi

      - name: Build .3dsx / .elf with devkitARM
        run: |
          docker run --rm -v "$PWD":/work -w /work devkitpro/devkitarm:latest \
            sh -c "dkp-pacman -Sy --noconfirm 3ds-dev || true; make"
          sudo chown -R "$USER" . || true
          ls -la KsushaPie3DS.*
          test -f KsushaPie3DS.elf

      - name: Install tools (makerom, bannertool, qrencode)
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git qrencode unzip curl

          mkdir -p "$PWD/tools_bin"
          cd "$PWD/tools_bin"

          # makerom: prebuilt release, falling back to building from source
          if curl -fsSL -o makerom.zip "https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip"; then
            unzip -o makerom.zip
          else
            echo "Prebuilt makerom not available, building from source"
            git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git
            (cd Project_CTR/makerom && make deps && make -j2)
            cp "$(find Project_CTR -name makerom -type f | head -n1)" makerom
          fi
          chmod +x makerom

          # bannertool: build from source
          # CMAKE_POLICY_VERSION_MINIMUM fixes the "Compatibility with CMake < 3.5" error
          git clone --depth 1 --recursive https://github.com/carstene1ns/3ds-bannertool.git
          cmake -S 3ds-bannertool -B bt_build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_C_FLAGS="-Wno-error -Wno-implicit-function-declaration -std=gnu11" \
            -DCMAKE_CXX_FLAGS="-Wno-error -std=gnu++14"
          cmake --build bt_build -j2
          cp "$(find bt_build -name bannertool -type f | head -n1)" bannertool
          chmod +x bannertool

          echo "$PWD" >> "$GITHUB_PATH"
          ls -la

      - name: Make the CIA (icon.png + banner.png)
        run: |
          set -e
          test -d romfs && test -n "$(ls -A romfs)" || { echo "romfs is missing or empty"; exit 1; }
          mkdir -p build
          bannertool makebanner -i banner.png -a banner.wav -o build/banner.bnr
          bannertool makesmdh -s "Ksusha cooks a pie 3" -l "Help Ksusha cook a pie" -p "Vova games studio" -i icon.png -o build/icon.icn
          makerom -f cia -o KsushaPie3DS.cia -elf KsushaPie3DS.elf -rsf app.rsf -target t -exefslogo \
            -banner build/banner.bnr -icon build/icon.icn \
            -DAPP_TITLE="Ksusha cooks a pie 3" -DAPP_ROMFS="$PWD/romfs"
          ls -la KsushaPie3DS.cia

      - name: Make the QR code
        run: |
          set -e
          URL="https://github.com/${{ github.repository }}/releases/download/latest/KsushaPie3DS.cia"
          echo "$URL" > download_url.txt
          qrencode -o KsushaPie3DS_QR.png -s 12 -m 2 "$URL"
          ls -la KsushaPie3DS_QR.png
          echo "### Scan with FBI: Remote Install > Scan QR Code" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release (CIA + 3DSX + QR)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Ksusha cooks a pie 3 (latest build)
          body: "Scan KsushaPie3DS_QR.png with FBI (Remote Install > Scan QR Code) or download the CIA directly."
          files: |
            KsushaPie3DS.cia
            KsushaPie3DS.3dsx
            KsushaPie3DS_QR.png

      - uses: actions/upload-artifact@v4
        with:
          name: KsushaPie3DS-build
          path: |
            KsushaPie3DS.cia
            KsushaPie3DS.3dsx
            KsushaPie3DS_QR.png
            download_url.txt
